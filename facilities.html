<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facilities | Facility Reservation System</title>
  <meta name="description" content="Manage facilities in the Reservation System" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏢</span> Facility Reservation System
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="user-name"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>

  <nav class="nav" id="main-nav"></nav>

  <main>
    <div class="page-head">
      <h2>Facilities</h2>
      <div class="actions">
        <button class="btn" id="btn-add" style="display:none;">+ Add Facility</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Search by name or location..." />
        <select id="filter-status">
          <option value="">Status: All</option>
          <option value="Active">Active</option>
          <option value="Under Maintenance">Under Maintenance</option>
        </select>
        <select id="filter-type">
          <option value="">Type: All</option>
        </select>
      </div>
      <div id="loading" class="loading"><div class="spinner"></div>Loading facilities...</div>
      <div class="table-wrap" id="table-wrap" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>Facility Name</th>
              <th>Type</th>
              <th>Capacity</th>
              <th>Location</th>
              <th>Status</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="facilities-tbody"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty" style="display:none;">No facilities found.</div>
    </div>
  </main>

  <!-- Add/Edit Facility Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <h3 id="modal-title">Add Facility</h3>
      <form id="facility-form">
        <input type="hidden" id="facility-id" />
        <div class="form-group">
          <label for="facility-name">Facility Name *</label>
          <input type="text" id="facility-name" required maxlength="100" placeholder="Conference Room A" />
          <div class="error-text" id="err-name">Facility name is required.</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="facility-type">Type *</label>
            <input type="text" id="facility-type" required maxlength="50" placeholder="Conference Room" />
          </div>
          <div class="form-group">
            <label for="facility-capacity">Capacity *</label>
            <input type="number" id="facility-capacity" required min="1" placeholder="50" />
          </div>
        </div>
        <div class="form-group">
          <label for="facility-location">Location *</label>
          <input type="text" id="facility-location" required maxlength="100" placeholder="Building A, 2nd Floor" />
        </div>
        <div class="form-group">
          <label for="facility-description">Description</label>
          <textarea id="facility-description" rows="2" maxlength="300" placeholder="Optional description..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="facility-status">Status</label>
            <select id="facility-status">
              <option value="Active">Active</option>
              <option value="Under Maintenance">Under Maintenance</option>
            </select>
          </div>
          <div class="form-group"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn" id="btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Reserve Modal (Requester) -->
  <div class="modal-backdrop" id="reserve-backdrop">
    <div class="modal">
      <h3>Reserve Facility <span class="muted text-sm" id="reserve-facility-name"></span></h3>
      <form id="reserve-form">
        <input type="hidden" id="reserve-facility-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="reserve-name">Your Name *</label>
            <input type="text" id="reserve-name" required maxlength="100" placeholder="Juan Dela Cruz" />
          </div>
          <div class="form-group">
            <label for="reserve-dept">Department *</label>
            <input type="text" id="reserve-dept" required maxlength="80" placeholder="College of ICT" />
          </div>
        </div>
        <div class="form-group">
          <label for="reserve-purpose">Purpose *</label>
          <input type="text" id="reserve-purpose" required maxlength="200" placeholder="Team meeting, seminar, etc." />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="reserve-start">Start Date & Time *</label>
            <input type="datetime-local" id="reserve-start" required />
          </div>
          <div class="form-group">
            <label for="reserve-end">End Date & Time *</label>
            <input type="datetime-local" id="reserve-end" required />
            <div class="error-text" id="err-end">End time must be after start time (BR-B4-02).</div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="btn-cancel-reserve">Cancel</button>
          <button type="submit" class="btn" id="btn-submit-reserve">Submit Request</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/facilities.js"></script>
</body>
</html>
