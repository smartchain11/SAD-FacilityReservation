<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Facility Reservation System</title>
  <meta name="description" content="Role-Based Facility Reservation and Approval System — SAD Lab 4 Section B" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>🏢 Facility Reservation System</h1>
      <p class="sub">SAD — Role-Based Facility Reservation and Approval</p>

      <div class="tabs">
        <button id="tab-login" class="active" type="button">Login</button>
        <button id="tab-signup" type="button">Sign Up</button>
      </div>

      <!-- Login form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="********" />
          <label class="show-pass"><input type="checkbox" data-toggle-pw="login-password" /> Show password</label>
        </div>
        <button class="btn block" type="submit">Sign In</button>
      </form>

      <!-- Signup form -->
      <form id="signup-form" class="hidden">
        <div class="form-group">
          <label for="su-email">Email</label>
          <input type="email" id="su-email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="su-role">Sign up as</label>
          <select id="su-role" required>
            <option value="requester">Requester (submit reservation requests)</option>
            <option value="facility_staff">Facility Staff (manage facility usage)</option>
            <option value="administrator">Administrator (full system access)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="su-password">Password <span class="muted text-sm">(min 6 characters)</span></label>
          <input type="password" id="su-password" required minlength="6" autocomplete="new-password" placeholder="********" />
          <label class="show-pass"><input type="checkbox" data-toggle-pw="su-password" /> Show password</label>
        </div>
        <button class="btn block" type="submit">Create Account</button>
      </form>
      <p class="muted text-sm" id="form-note" style="text-align:center;margin-top:16px;">
        First time? Create an account above.
      </p>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
