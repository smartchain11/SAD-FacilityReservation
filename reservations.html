<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservations | Facility Reservation System</title>
  <meta name="description" content="View and manage facility reservations" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏢</span> Facility Reservation System
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="user-name"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>

  <nav class="nav" id="main-nav"></nav>

  <main>
    <div class="page-head">
      <h2>Reservations</h2>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Search requester, facility, department..." />
        <select id="filter-status">
          <option value="">Status: All</option>
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
          <option value="Scheduled">Scheduled</option>
          <option value="In Use">In Use</option>
          <option value="Completed">Completed</option>
          <option value="Rejected">Rejected</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
      <div id="loading" class="loading"><div class="spinner"></div>Loading reservations...</div>
      <div class="table-wrap" id="table-wrap" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>Facility</th>
              <th>Requester</th>
              <th>Department</th>
              <th>Purpose</th>
              <th>Start</th>
              <th>End</th>
              <th>Status</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="reservations-tbody"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty" style="display:none;">No reservations found.</div>
    </div>
  </main>

  <div id="toast-wrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/reservations.js"></script>
</body>
</html>
