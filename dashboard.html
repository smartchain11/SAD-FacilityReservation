<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Facility Reservation System</title>
  <meta name="description" content="Dashboard for the Facility Reservation and Approval System" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏢</span> Facility Reservation System
    </div>
    <div class="topbar-right">
      <span class="user-chip" id="user-name"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>

  <nav class="nav" id="main-nav"></nav>

  <main>
    <div class="page-head">
      <h2>Dashboard</h2>
    </div>

    <div class="stats-grid">
      <div class="stat-card indigo">
        <div class="label">Total Facilities</div>
        <div class="value" id="stat-total">0</div>
      </div>
      <div class="stat-card green">
        <div class="label">Active</div>
        <div class="value" id="stat-active">0</div>
      </div>
      <div class="stat-card amber">
        <div class="label">Under Maintenance</div>
        <div class="value" id="stat-maintenance">0</div>
      </div>
      <div class="stat-card purple">
        <div class="label">Pending Requests</div>
        <div class="value" id="stat-pending">0</div>
      </div>
      <div class="stat-card teal">
        <div class="label">Scheduled / In Use</div>
        <div class="value" id="stat-in-use">0</div>
      </div>
      <div class="stat-card" style="border-color:#dbeafe;">
        <div class="label">Completed</div>
        <div class="value" id="stat-completed">0</div>
      </div>
    </div>

    <div class="card">
      <h3>Recent Reservations</h3>
      <div id="loading" class="loading"><div class="spinner"></div>Loading dashboard...</div>
      <div class="table-wrap" id="table-wrap" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>Facility</th>
              <th>Requester</th>
              <th>Start</th>
              <th>End</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="recent-tbody"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty" style="display:none;">No reservations yet.</div>
    </div>
  </main>

  <div id="toast-wrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
